id: select-dev
version: 1

channel:
  title: SELECT Blog
  link: https://select.dev/blog
  description: Articles on Snowflake and Databricks cost optimization, performance, and data engineering from the SELECT team.
  language: en-us
  author: SELECT
  ttl: 60

schedule:
  interval: 1h
  max_items: 50
  timezone: America/Toronto  # their dates carry no time of day; read them in SELECT's own zone

discovery:
  - type: feed
    url: https://select.dev/blog/feed.xml
    include: ['^https://select\.dev/blog/[^/?#]+$']

item:
  # og:title and the JSON-LD headline are shortened for search; the page's h1
  # and their feed carry the full title.
  title:   ['css:article h1', listing:title, meta:og:title]
  summary: [meta:og:description, meta:description, listing:description]
  author:  [jsonld:Article.author]
  image:   [meta:og:image]
  published:
    # JSON-LD gives a date-only value, so a post first seen on its publish day
    # gets its first-seen time. Their feed pins every post to 00:00 GMT, which
    # lands the post in the past and some readers skip it.
    sources: [jsonld:Article.datePublished, listing:published]
  updated:
    sources: [jsonld:Article.dateModified]
  content:
    # The body is split across several prose blocks (intro, main text, FAQ).
    selector: 'article .site-page-prose'
    # Code blocks are Expressive Code frames with a copy button beside each.
    exclude: ['script', 'style', 'noscript', 'button', '.copy']
