# Global settings (PLAN.md §4.1). Relative paths resolve against this file's directory.
sites_dir: sites
store_path: feed-me.db
out_dir: out
listen: ":8080"

# Used for each feed's rel=self link and the OPML export. Override with FEED_ME_PUBLIC_BASE_URL.
public_base_url: http://localhost:8080
base_path: /

# Appended to the User-Agent: feed-me/<version> (+<contact_url>)
# contact_url: https://example.com/feed-me

log:
  format: text   # json in the container
  level: info

fetch:
  rate: 1/s
  timeout: 20s
